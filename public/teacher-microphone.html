<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教师机麦克风授权</title><link rel="stylesheet" href="/style.css?v=1"><script type="module" src="/teacher-microphone.mjs?v=1"></script></head><body class="microphone-window-page"><main class="microphone-window"><p class="eyebrow">教师机 · 现场实测</p><h1>麦克风授权与测试</h1><p>允许麦克风后，先安静约1.5秒，再请同学用不同音量说话。</p><div class="choice-row"><button id="helper-start" class="primary" disabled>开启麦克风</button><button id="helper-stop">停止采声</button><button id="helper-calibrate">重新校准</button></div><p id="helper-status" role="status">正在连接教师大屏…</p><div class="sound-meter"><i id="helper-meter"></i></div><p>相对响度：<b id="helper-level">0</b>（不是分贝）</p><p id="helper-connection" class="note"></p><p class="note">保持此窗口打开，可以切回教师大屏。关闭窗口或停止采声会释放麦克风；声音不会录制或上传。</p><button id="helper-close">停止并关闭窗口</button></main></body></html>
